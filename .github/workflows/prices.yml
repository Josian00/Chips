name: Update prices

# Once a day, pull fresh prices from Open Prices into src/data/prices.json.
# If anything changed, commit it and redeploy the site.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-prices.mjs
      - name: Commit and redeploy if prices changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/prices.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update chip prices" -- src/data/prices.json
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
          # start the deploy explicitly.
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
